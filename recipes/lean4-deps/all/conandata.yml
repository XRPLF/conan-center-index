# lake fetches mathlib and its closure from the revisions pinned in
# lake/<version>/lake-manifest.json, exported alongside this recipe --
# conan.tools.files.get is never used here. This block records which mathlib
# revision the version corresponds to, and satisfies the version check in
# export_all.sh.
#
# The revision is not repeated as a separate field: lake-manifest.json is the
# single source of truth for it, and a second copy could only drift.
sources:
  "4.34.1":
    url: "https://github.com/leanprover-community/mathlib4/tree/d13f23b723b8a846827a245b89c10fc7d3f11612"
